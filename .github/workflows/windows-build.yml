name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas rapidfuzz reportlab openpyxl pyinstaller

      - name: Build executable
        run: |
          pyinstaller ^
            --noconfirm ^
            --onefile ^
            --noconsole ^
            --name SkaitijumaSalidzinatajs ^
            --add-data "allproducts.xlsx;." ^
            --add-data "inventura;inventura" ^
            --add-data "source;source" ^
            --add-data "counts;counts" ^
            --add-data "reports;reports" ^
            skaitijumaSalidzinatajsMain.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkaitijumaSalidzinatajs-windows
          path: dist/SkaitijumaSalidzinatajs.exe
